_metadata:
  major_version: 2
  minor_version: 1

display_information:
  name: Scheherazade
  description: A local AI companion agent that lives in your workspace.
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: Scheherazade
    always_online: true

oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - mpim:history
      - chat:write
      # files:write -- channel-slack.mjs send_file_to_discord uses
      # files.uploadV2; without this scope every file send dies at runtime.
      # users:read -- sender display-name resolution via users.info.
      # (multichannel v0.0.18 audit: both were missing from the pre-backend
      # draft of this manifest.)
      - files:write
      - users:read

settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
