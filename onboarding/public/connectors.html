<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade - Connectors</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="app-nav"></div>

      <div class="page-header">
        <h1 id="conn-title"></h1>
      </div>

      <!-- 대공사 2026-08-05: two-column page grid — LLM auth card and the
           usage card sit side by side when the window is wide; the claude.ai
           connectors card spans both columns below. Messenger group lives
           on /channels since v0.0.18. -->
      <div class="page-grid">
        <div class="category" id="conn-providers">
          <div class="category-label" id="conn-providers-label"></div>
          <div class="entries">
            <div class="entry-row">
              <div class="entry-main">
                <div class="entry-value" id="conn-provider-chatgpt-name"></div>
                <div class="entry-meta" id="conn-provider-chatgpt-status"></div>
                <!-- Live serving receipt: the proxy's own /health model, only
                     when something actually answers. 셸은 현실. -->
                <div class="entry-meta" id="conn-provider-chatgpt-receipt"></div>
              </div>
              <button class="secondary hidden" id="conn-provider-chatgpt-test"></button>
              <button class="secondary hidden" id="conn-provider-chatgpt-relogin"></button>
              <button class="secondary" id="conn-provider-chatgpt-btn"></button>
            </div>
            <div class="entry-row">
              <div class="entry-main">
                <div class="entry-value" id="conn-provider-ollama-name"></div>
                <div class="entry-meta" id="conn-provider-ollama-status"></div>
              </div>
              <button class="secondary hidden" id="conn-provider-ollama-test"></button>
              <button class="secondary hidden" id="conn-provider-ollama-relogin"></button>
              <button class="secondary" id="conn-provider-ollama-btn"></button>
            </div>
            <!-- ollama key-mode (2026-08-04): connect/replace-key open this
                 paste flow -- same write-only input pattern as the Claude API
                 key flow below (key never rendered back). -->
            <div class="claude-key-flow hidden" id="conn-ollama-flow">
              <div class="field">
                <input type="password" id="conn-ollama-key" />
              </div>
              <div class="step-actions">
                <span class="status-line" id="conn-ollama-status-line"></span>
                <!-- Redirect to the key console (0.67 feedback: "이거 있고없고
                     차이 존나큼") -- same window.open house pattern as the
                     BotFather / Slack-console buttons on /channels. -->
                <button class="secondary" id="conn-ollama-get-key"></button>
                <button class="secondary" id="conn-ollama-save"></button>
              </div>
            </div>
            <div class="entry-row">
              <div class="entry-main">
                <div class="entry-value" id="conn-provider-claude-name"></div>
                <div class="entry-meta" id="conn-provider-claude-status"></div>
              </div>
              <!-- Test added 2026-08-06 (0.67 feedback: "이 페이지 기능좀
                   일원화" -- every connected row carries the same Test +
                   Re-login pair; claude was the odd one out). -->
              <button class="secondary hidden" id="conn-provider-claude-test"></button>
              <button class="secondary hidden" id="conn-claude-cancel"></button>
              <button class="secondary" id="conn-provider-claude-btn"></button>
            </div>
          </div>
          <!-- Claude subscription re-login (2026-08-04): same in-app
               `claude setup-token` capture the wizard uses; the code field
               appears only if the CLI actually asks for a paste. -->
          <div class="claude-key-flow hidden" id="conn-claude-flow">
            <div class="field hidden" id="conn-claude-code-field">
              <div class="field-hint" id="conn-claude-code-hint"></div>
              <div class="step-actions">
                <input type="text" autocomplete="off" id="conn-claude-code" />
                <button class="secondary" id="conn-claude-code-btn"></button>
              </div>
            </div>
            <div class="step-actions">
              <span class="status-line" id="conn-claude-status-line"></span>
            </div>
          </div>
        </div>

        <!-- Usage gauges: its own card (2026-08-04 "이게 킥임" → 2026-08-05
             gauge bars). connectors.js builds the lane DOM. -->
        <div class="category" id="conn-usage-card">
          <div class="category-header">
            <div class="category-label" id="conn-usage-label"></div>
            <button class="secondary" id="conn-usage-refresh"></button>
          </div>
          <div class="usage-lanes" id="conn-usage-gauges">
            <div class="usage-lane" id="conn-usage-lane-claude"></div>
            <div class="usage-lane" id="conn-usage-lane-codex"></div>
            <div class="usage-lane" id="conn-usage-lane-ollama"></div>
          </div>
        </div>

        <!-- Agent model/effort config (moved from memory.html's agent control
             panel, subpage split 2026-07-14). SELECT-driven config half; the
             read-only status display half lives in the nav.js shell above. -->
        <div class="category" id="set-agent-config">
          <div class="category-label" id="set-agent-config-label"></div>
          <div class="agent-control-row">
            <label for="set-model-select" id="set-model-label"></label>
            <select id="set-model-select"></select>
          </div>
          <!-- Ollama by-URL picker (2026-08-04, the owner: paste an
               ollama.com/library/{model} URL to run a model the dropdown
               doesn't list). Hidden until the "Other (ollama.com URL)"
               catalog action is picked. -->
          <div class="field hidden" id="set-ollama-url-field">
            <div class="field-hint" id="set-ollama-url-hint"></div>
            <div class="step-actions">
              <input type="text" autocomplete="off" id="set-ollama-url-input" />
              <button class="secondary" id="set-ollama-url-apply"></button>
            </div>
            <div class="status-line" id="set-ollama-url-status"></div>
          </div>
          <div class="agent-control-row">
            <label for="set-effort-select" id="set-effort-label"></label>
            <select id="set-effort-select"></select>
          </div>
          <!-- Apply-state line (IA v0.0.9): explains any gap between these
               selects (intent) and the running child (reality). A spawn
               refused by the proxy model-receipt gate surfaces its reason
               here, next to the picker that caused it. -->
          <div class="agent-control-hint" id="set-apply-state"></div>
        </div>


        <!-- Custom provider (generic OpenAI-compatible proxy, 2026-07-25).
             Settings-page-only, like claude-subscription/chatgpt/ollama before
             it (see http-server.cjs's ROUTER_WIRED comment) -- there is no
             onboarding-wizard tab for this. Always visible (same convention as
             every other category on this page), not gated on the current
             provider: switching TO custom and editing an already-custom
             install's fields share this one form. Its own status/save pair
             (not the shared set-apply-state line above, which only settles
             AFTER a restart is already in flight). -->
        <div class="category" id="set-custom">
          <div class="category-label" id="set-custom-label"></div>
          <p class="subtitle" id="set-custom-note"></p>
          <div class="agent-control-row">
            <label for="set-custom-preset-select" id="set-custom-preset-label"></label>
            <select id="set-custom-preset-select"></select>
          </div>
          <div class="agent-control-row">
            <label for="set-custom-url-input" id="set-custom-url-label"></label>
            <input type="text" id="set-custom-url-input" placeholder="http://localhost:18080" />
          </div>
          <div class="agent-control-row">
            <label for="set-custom-key-input" id="set-custom-key-label"></label>
            <input type="password" id="set-custom-key-input" autocomplete="off" />
          </div>
          <div class="agent-control-row">
            <label for="set-custom-model-input" id="set-custom-model-label"></label>
            <input type="text" id="set-custom-model-input" />
          </div>
          <div class="step-actions">
            <span class="field-hint hidden" id="set-custom-status"></span>
            <button id="set-custom-save"></button>
          </div>
          <!-- Pasted definition (2026-07-29). Sits BELOW the three fields on
               purpose: the fields are the primary, understandable path, and
               this is the shortcut for someone who already holds a provider
               blob from another tool. It never saves directly -- it resolves
               the paste server-side (POST .../custom-provider/preview, which
               writes nothing) and fills the fields above, so the user reviews
               a real base URL and model id before the normal save + confirm
               restarts the agent. -->
          <details id="set-custom-json">
            <summary id="set-custom-json-summary"></summary>
            <p class="subtitle" id="set-custom-json-note"></p>
            <textarea id="set-custom-json-input" rows="6" spellcheck="false" autocomplete="off"></textarea>
            <div class="step-actions">
              <span class="field-hint hidden" id="set-custom-json-status"></span>
              <button id="set-custom-json-load"></button>
            </div>
          </details>
        </div>

        <!-- Attach topology (0.1.0 prep, design-0016). The one setting that
             changes WHO owns the agent process. Bootstrap must run in the
             user's own terminal (TCC attribution) -- the card below hands out
             the exact line, the app never runs it. -->
        <div class="category" id="set-topology">
          <div class="category-label" id="set-topology-label"></div>
          <p class="subtitle" id="set-topology-note"></p>
          <div class="agent-control-row">
            <label for="set-topology-select" id="set-topology-select-label"></label>
            <select id="set-topology-select"></select>
          </div>
          <div class="agent-control-hint" id="set-topology-state"></div>
          <div class="field hidden" id="set-topology-bootstrap-card">
            <div class="field-hint" id="set-topology-bootstrap-why"></div>
            <input type="text" id="set-topology-bootstrap-cmd" readonly />
            <div class="step-actions">
              <button class="secondary" id="set-topology-bootstrap-copy"></button>
            </div>
          </div>
          <div class="step-actions">
            <span class="field-hint hidden" id="set-topology-status"></span>
            <button id="set-topology-save"></button>
          </div>
        </div>

        <!-- Prerequisite doctor (2026-08-06, 0.67 clean-mac feedback: the
             agent was silently dead with no claude CLI installed and NOTHING
             said why). Rows come from GET /api/doctor -- the same resolvers
             the spawn gate uses, never a cached flag. The install field
             appears only when the claude CLI row is red. -->
        <div class="category" id="conn-doctor">
          <div class="category-header">
            <div class="category-label" id="conn-doctor-label"></div>
            <button class="secondary" id="conn-doctor-recheck"></button>
          </div>
          <div class="field-hint" id="conn-doctor-note"></div>
          <div class="entries" id="conn-doctor-rows"></div>
          <div class="field hidden" id="conn-doctor-install-field">
            <div class="field-hint" id="conn-doctor-install-hint"></div>
            <div class="step-actions">
              <input type="text" readonly id="conn-doctor-install-cmd" />
              <button class="secondary" id="conn-doctor-install-copy"></button>
              <button class="secondary" id="conn-doctor-docs"></button>
            </div>
          </div>
        </div>

        <!-- claude.ai connectors (Gmail/Calendar/…). In-app OAuth intercept.
             Lane warning shows first when the running lane can't actually
             USE connectors even once authorized. -->
        <div class="category span-2" id="conn-mcp">
          <div class="category-label" id="conn-mcp-label"></div>
          <div class="field-hint hidden" id="conn-mcp-lane-warning"></div>
          <div class="status-line" id="conn-mcp-status"></div>
          <div class="entries" id="conn-mcp-entries"></div>
        </div>
      </div>

    </div>

    <div class="toast" id="conn-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/model-catalog.cjs"></script>
    <script src="/js/connectors.js"></script>
  </body>
</html>
