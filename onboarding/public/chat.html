<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade — Chat</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell chat-shell">
      <div id="app-nav"></div>

      <div class="page-header">
        <h1 id="ct-title"></h1>
        <!-- lane status chip (0.1.4, PO item #3): which model this chat is
             actually riding and whether it can see images -- the 2026-08-11
             field bug would have been self-evident with this visible. -->
        <span class="chat-lane-chip" id="ct-lane-chip" hidden></span>
        <!-- "New conversation" clean break (2026-08-18): fresh session +
             empty transcript, no checkpoint handoff, memory kept. Irreversible,
             so it confirms first (chat.js). secondary like the other controls;
             the destructive emphasis lives in the confirm dialog. -->
        <button class="secondary chat-new-convo" id="ct-new-convo" type="button"></button>
      </div>
      <p class="subtitle" id="ct-subtitle"></p>

      <!-- aria-live polite: a conversation SHOULD narrate new turns, unlike
           the logs firehose next door. The wrap exists so the jump pill can
           overlay the pane without joining the scroll flow (P1). -->
      <div class="chat-pane-wrap">
        <div class="chat-pane" id="ct-pane" aria-live="polite"></div>
        <button class="chat-jump-pill chat-pill-hidden" id="ct-jump" type="button"></button>
      </div>
      <p class="chat-status" id="ct-status"></p>

      <!-- attachment chips (image upload, 2026-08-04): pending images shown
           above the composer, removable until send. -->
      <div class="chat-attach-chips" id="ct-attach-chips"></div>
      <div class="chat-input-row">
        <input type="file" id="ct-file" accept="image/png,image/jpeg,image/gif,image/webp,.pdf,.txt,.md,.csv,.tsv,.json,.log,.xml,.yaml,.yml" multiple hidden />
        <button class="secondary" id="ct-attach" title="Attach image">+</button>
        <textarea id="ct-input" rows="1" autocomplete="off"></textarea>
        <button id="ct-send"></button>
      </div>
    </div>

    <div class="toast" id="ct-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
