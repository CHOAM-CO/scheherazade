<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade — Chat</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell chat-shell">
      <div id="app-nav"></div>

      <div class="page-header chat-page-header">
        <h1 id="ct-title"></h1>
        <!-- quick menu (2026-10-07, Mino): same row as the lane chip and New conversation, on the LEFT. -->
<nav class="button-row chat-quickbar" id="ct-quickbar" aria-label="Chat quick menu">
<button class="qb secondary icon-button" id="qb-whats-new" type="button" data-state="idle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 4v10m0 4v2"/></svg><span class="qb-dot" hidden></span><span class="qb-tooltip" role="tooltip"></span></button>
<button class="qb secondary icon-button" id="qb-look-back" type="button" data-state="idle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m15 3 6 6-9 9-6-6Z"/><path d="M6 12c-4 0-4 9-4 9s9 0 9-4"/></svg><span class="qb-tooltip" role="tooltip"></span></button>
<button class="qb secondary icon-button" id="qb-browse" type="button" data-state="off"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span class="qb-tooltip" role="tooltip"></span></button>
<button class="qb secondary icon-button" id="qb-dream" type="button" data-state="idle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></svg><span class="qb-tooltip" role="tooltip"></span></button>
<button class="qb secondary icon-button" id="qb-today" type="button" data-state="idle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/></svg><span class="qb-tooltip" role="tooltip"></span></button>
<button class="qb secondary icon-button" id="qb-companion" type="button" data-state="off" aria-pressed="false" aria-label="Turn companion on" title="Turn companion on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9 12h.01M15 12h.01M9 16q3 2 6 0"/></svg><span class="qb-tooltip" role="tooltip">Turn companion on</span></button>
</nav>
        <!-- lane status chip (0.1.4, PO item #3): which model this chat is
             actually riding and whether it can see images -- the 2026-08-11
             field bug would have been self-evident with this visible. -->
        <span class="chat-lane-chip" id="ct-lane-chip" hidden></span>
        <!-- "New conversation" clean break (2026-08-18): fresh session +
             empty transcript, no checkpoint handoff, memory kept. Irreversible,
             so it confirms first (chat.js). secondary like the other controls;
             the destructive emphasis lives in the confirm dialog. -->
        <button class="secondary chat-new-convo" id="ct-new-convo" type="button"></button>
      </div>
      <p class="subtitle" id="ct-subtitle"></p>

      <!-- aria-live polite: a conversation SHOULD narrate new turns, unlike
           the logs firehose next door. The wrap exists so the jump pill can
           overlay the pane without joining the scroll flow (P1). -->
      <div class="chat-pane-wrap">
        <div class="chat-pane" id="ct-pane" aria-live="polite"></div>
        <button class="chat-jump-pill chat-pill-hidden" id="ct-jump" type="button"></button>
      </div>
      <p class="chat-status" id="ct-status"></p>

      <!-- agent controls (0.2.12, the owner 08-23 22:28: "모델 드랍다운이랑
           에포트는 말풍선쪽에 넣지 말고 다른칸에(위에 정렬)") -- model
           quick-switch + effort pulled OUT of the composer card into their
           own quiet row above it. Same chip styling, same server contracts
           as the Engine page (/api/agent/model, /api/agent/effort). -->
      <div class="chat-agent-controls">
        <select id="ct-model-select" class="chat-model-select" hidden></select>
        <select id="ct-effort-select" class="chat-model-select chat-effort-select" hidden></select>
      </div>
      <!-- composer (0.2.6): two-deck card, claude.ai/chatgpt pattern from the
           08-20 reference captures -- text on top, controls bar beneath.
           (The model chip lived here 0.2.6-0.2.11; moved to the row above.) -->
      <div class="chat-input-row">
        <input type="file" id="ct-file" accept="image/png,image/jpeg,image/gif,image/webp,.pdf,.txt,.md,.csv,.tsv,.json,.log,.xml,.yaml,.yml" multiple hidden />
        <!-- pending attachments (composer-grow, 2026-10-07): the strip lives
             INSIDE the card, above the textarea, Discord-style. Images are
             real thumbnails (same blob fetch as sent bubbles), other files
             keep the chip look. Removable until send; hidden when empty. -->
        <div class="chat-attach-chips" id="ct-attach-chips"></div>
        <textarea aria-label="Message" id="ct-input" rows="1" autocomplete="off"></textarea>
        <!-- steering hint: only visible while a turn is running -->
        <p class="chat-steer-hint" id="ct-steer-hint" hidden></p>
        <div class="button-row chat-composer-bar">
          <button class="secondary icon-button" id="ct-attach" title="Attach image">+</button>
          <span class="chat-composer-spacer"></span>
          <!-- Stop / steer (0.3.1). While a turn is in flight the composer
               swaps Send for Stop (claude.ai pattern the card already
               imitates) and the textarea keeps working: what it sends then
               MERGES into the running turn rather than starting a new one
               (design-0020 probe 6), which is the steering half. The hint
               below says which of the two the box is about to do, because
               those are genuinely different acts. -->
          <button id="ct-stop" class="secondary" hidden></button>
          <button id="ct-send"></button>
        </div>
      </div>
    </div>


    <div class="toast" id="ct-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/model-catalog.cjs"></script>
    <!-- design-0025: the live-turn derivation, loaded before chat.js reads it
         (window.SCHZ_TURN_STATE). Same dual-environment contract as
         model-catalog.cjs, so tests require the same bytes. -->
    <script src="/js/turn-state.cjs"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/companion-quick-toggle.js"></script>
    <script src="/js/tts-core.cjs"></script>
    <script src="/js/tts.js"></script>
    <script src="/js/stt-core.cjs"></script>
    <script src="/js/stt.js"></script>
  <script src="/js/call-core.cjs"></script>
    <script src="/js/call.js"></script>
  </body>
</html>
