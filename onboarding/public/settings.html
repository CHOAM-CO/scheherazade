<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade - Settings</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="app-nav"></div>

      <!-- No back-link here (IA pass 2026-07-25). Every page already carries
           the nav.js tab bar, and a "back to memory" link implied a hierarchy
           that does not exist -- memory is not this page's parent, it is a
           sibling tab. Removed from settings/channels/connectors/logs alike. -->
      <div class="page-header">
        <h1 id="set-title"></h1>
      </div>

      <!-- THREE GROUPS (IA pass 2026-07-25). The page previously ran seven
           flat blocks in the order rename -> model -> proxy -> autonomy ->
           topology -> sudo -> permissions, interleaving three different kinds
           of thing, which is what made it read as a junk drawer. The grouping
           below is the organizing question each block answers:
             AGENT   -- who is this agent and what does it do on its own
             ENGINE  -- what powers it
             SYSTEM  -- what it is allowed to do on this Mac
           Category ids and every control id are UNCHANGED; settings.js binds
           by id and must keep working untouched. -->

      <!-- 대공사 2026-08-05: groups reflow into two columns on wide windows
           (요구 ⑧). DANGER always spans full width — it must never sit
           beside an innocent group. -->
      <div class="settings-layout">
      <nav class="settings-rail"></nav>
      <div class="page-grid settings-content">

      <!-- ── AGENT ───────────────────────────────────────────────────────── -->
      <section class="settings-group">
        <h2 hidden class="settings-group-label" id="set-group-agent"></h2>

        <div class="category" id="set-identity">
          <div class="category-label" data-polish="identity"></div>
          <p class="subtitle" data-polish="identityNote"></p>
          <div class="agent-control-row">
            <label for="set-rename-input" id="set-rename-label"></label>
            <input type="text" id="set-rename-input" />
          </div>
          <div class="agent-control-hint hidden" id="set-rename-status"></div>
          <div class="step-actions">
            <button id="set-rename-save"></button>
          </div>

          <!-- Profile picture (2026-09-28, the owner "프로필 사진"). One
               upload path, the same JSON {filename, dataBase64} body the
               chat attachments already use. The preview is NOT a bare
               <img src="/api/settings/avatar"> — every /api GET sits behind
               the X-Onboard-Token gate and that src would 403, so nav.js's
               shared resolver fetches the bytes with the token and hands
               back a blob object URL. With nothing uploaded it shows the
               app icon at 256px. -->
          <div class="agent-control-row">
            <label for="set-avatar-input" id="set-avatar-label"></label>
            <img id="set-avatar-preview" class="agent-avatar-preview" alt="" />
            <input type="file" id="set-avatar-input" accept="image/png,image/jpeg,image/webp" hidden />
          </div>
          <div class="step-actions">
            <span class="field-hint hidden" id="set-avatar-status"></span>
            <button id="set-avatar-choose"></button>
            <button class="secondary" id="set-avatar-remove"></button>
          </div>

          <!-- The user's own picture (0.3.5, 2026-09-29): the same control,
               a second slot. settings.js wires both through one function;
               only the id prefix, the route and the empty state differ (this
               slot has no fallback, so with nothing uploaded the preview is
               an empty circle and the chat draws no picture on user rows). -->
          <div class="agent-control-row">
            <label for="set-user-avatar-input" id="set-user-avatar-label"></label>
            <img id="set-user-avatar-preview" class="agent-avatar-preview" alt="" />
            <input type="file" id="set-user-avatar-input" accept="image/png,image/jpeg,image/webp" hidden />
          </div>
          <div class="step-actions">
            <span class="field-hint hidden" id="set-user-avatar-status"></span>
            <button id="set-user-avatar-choose"></button>
            <button class="secondary" id="set-user-avatar-remove"></button>
          </div>
        </div>

        <!-- Autonomous cycle (v0.0.6). The only setting on this page that
             spends the user's subscription while they are not watching, so it
             carries its cost note ABOVE the switch, ships OFF, and shows
             today's real token count next to the cap it is enforced against. -->
        <div class="category" id="set-autonomy">
          <div class="category-label" id="set-autonomy-label"></div>
          <p class="subtitle" id="set-autonomy-note"></p>

          <div class="agent-control-row">
            <label for="set-autonomy-enabled" id="set-autonomy-enabled-label"></label>
            <input type="checkbox" id="set-autonomy-enabled" />
          </div>

          <div class="agent-control-row">
            <label for="set-autonomy-start" id="set-autonomy-window-label"></label>
            <span class="control-pair">
              <input type="text" id="set-autonomy-start" placeholder="02:00" />
              <span class="control-pair-sep">to</span>
              <input type="text" id="set-autonomy-end" placeholder="06:00" />
            </span>
          </div>
          <div class="agent-control-hint" id="set-autonomy-window-note"></div>

          <div class="agent-control-row">
            <label for="set-autonomy-cap" id="set-autonomy-cap-label"></label>
            <input type="text" id="set-autonomy-cap" inputmode="numeric" />
          </div>
          <div class="agent-control-hint" id="set-autonomy-cap-note"></div>

          <div class="status-line" id="set-autonomy-usage"></div>
          <div class="status-line" id="set-autonomy-last"></div>

          <div class="step-actions">
            <span class="field-hint hidden" id="set-autonomy-status"></span>
            <button id="set-autonomy-save"></button>
          </div>
        </div>
      </section>

      <!-- ── SYSTEM ──────────────────────────────────────────────────────── -->
      <section class="settings-group">
        <h2 hidden class="settings-group-label" id="set-group-system"></h2>

        <!-- sudo askpass (0.1.0 prep, P4 spec). Ships OFF. The password field
             is write-only: the page never reads the stored value back, only
             whether one exists. -->
        <div class="category" id="set-sudo">
          <div class="category-label" id="set-sudo-label"></div>
          <p class="subtitle" id="set-sudo-note"></p>
          <div class="agent-control-row">
            <label for="set-sudo-enabled" id="set-sudo-enabled-label"></label>
            <input type="checkbox" id="set-sudo-enabled" />
          </div>
          <div class="agent-control-row">
            <label for="set-sudo-password" id="set-sudo-password-label"></label>
            <input type="password" id="set-sudo-password" autocomplete="off" />
          </div>
          <div class="agent-control-hint" id="set-sudo-state"></div>
          <div class="step-actions">
            <span class="field-hint hidden" id="set-sudo-status"></span>
            <button id="set-sudo-save"></button>
          </div>
        </div>

        <!-- Permission checklist (P0, 2026-07-15 — docs/permission-visibility-
             design.md). Shows this host's wall map BEFORE the agent hits the
             walls mid-task. Rows render from /api/permissions/status; probes
             that cannot measure say so instead of pretending granted/denied.
             design-0023 P4: which rows exist is per-platform (macOS TCC +
             sudo + SIP; Linux sudo + keyring; Windows nothing), and the whole
             block is gated on the server's permissionsPanel capability. -->
        <div class="category" id="set-perms">
          <div class="category-label" id="set-perms-label"></div>
          <p class="subtitle" id="set-perms-note"></p>
          <div id="set-perms-rows"></div>
          <div class="field-hint hidden" id="set-perms-relaunch"></div>
        </div>
      </section>

      <!-- ── ABOUT / UPDATE (2026-08-04, the owner "오토 업데이트 버튼 어딨니?"
           -- the nav banner only appears WHEN an update exists, so a user
           on the latest version had no surface at all. This row is the
           manual check: current version + Check-now button, force=1
           bypassing the 6h cache.) ──────────────────────────────────── -->
      <section class="settings-group">
        <h2 hidden class="settings-group-label" id="set-group-migrate"></h2>
        <div class="category" id="set-migrate">
          <div class="category-label" id="set-migrate-label"></div>
          <p class="subtitle" id="set-migrate-hint"></p>
          <div id="set-migrate-tools"></div>
          <div class="step-actions">
            <span class="status-line" id="set-migrate-status"></span>
            <button id="set-migrate-start"></button>
          </div>
          <!-- design-0023 handover: agents the fixed probes can't know
               about. Primary: agent-led discovery (rev B — mdfind hunt +
               per-folder consent in chat). Fallback: point at a folder. -->
          <div class="category-label" id="set-handover-label"></div>
          <p class="subtitle" id="set-handover-hint"></p>
          <div class="step-actions">
            <span class="status-line" id="set-handover-discover-status"></span>
            <button id="set-handover-discover"></button>
          </div>
          <div id="set-handover-discover-tools"></div>
          <div class="step-actions">
            <button id="set-handover-discover-copy" class="hidden"></button>
          </div>
          <p class="subtitle" id="set-handover-manual-hint"></p>
          <div class="handover-row">
            <input id="set-handover-path" type="text" spellcheck="false" />
            <button id="set-handover-check"></button>
          </div>
          <div id="set-handover-tools"></div>
          <div class="step-actions">
            <span class="status-line" id="set-handover-status"></span>
            <button id="set-handover-start" class="hidden"></button>
          </div>
        </div>

        <h2 hidden class="settings-group-label" id="set-group-about"></h2>
        <div class="category" id="set-about">
          <div class="category-label" id="set-about-label"></div>
          <p class="subtitle" id="set-about-version"></p>
          <div class="step-actions">
            <span class="status-line" id="set-update-status"></span>
            <button class="secondary" id="set-update-check"></button>
            <button class="secondary hidden" id="set-update-open"></button>
          </div>
        </div>
      </section>

      <p class="settings-group span-2"><a href="/chat" id="browse-live-pointer"></a></p>

      <!-- ── DANGER (v0.0.35: in-app clean uninstall) ────────────────────── -->
      <section class="settings-group span-2">
        <h2 hidden class="settings-group-label" id="set-group-danger"></h2>
        <div class="category" id="seed-settings"></div>
        <div class="category danger-zone" id="set-danger">
          <div class="category-label" id="set-danger-label"></div>
          <p class="subtitle" id="set-danger-note"></p>
          <div class="step-actions">
            <button class="danger" id="set-danger-delete"></button>
          </div>
        </div>
      </section>

      </div><!-- /.page-grid -->
      </div>
    </div>

    <div class="toast" id="set-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/import-picker.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/seed-settings.js"></script>
  </body>
</html>
