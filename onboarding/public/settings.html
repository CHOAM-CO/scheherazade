<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade — 설정</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="app-nav"></div>

      <div class="page-header">
        <h1 id="set-title"></h1>
        <div class="page-nav">
          <a href="/memory" id="set-back-link"></a>
        </div>
      </div>

      <div class="field">
        <label id="set-rename-label"></label>
        <input type="text" id="set-rename-input" />
        <div class="field-hint hidden" id="set-rename-status"></div>
      </div>
      <div class="step-actions">
        <span></span>
        <button id="set-rename-save"></button>
      </div>

      <!-- Agent model/effort config (moved from memory.html's agent control
           panel, subpage split 2026-07-14). SELECT-driven config half; the
           read-only status display half lives in the nav.js shell above. -->
      <div class="category" style="margin-top: 2.5rem" id="set-agent-config">
        <div class="category-label" id="set-agent-config-label"></div>
        <div class="agent-control-row">
          <label for="set-model-select" id="set-model-label"></label>
          <select id="set-model-select"></select>
        </div>
        <div class="agent-control-row">
          <label for="set-effort-select" id="set-effort-label"></label>
          <select id="set-effort-select"></select>
        </div>
        <!-- Apply-state line (IA v0.0.9): explains any gap between these
             selects (intent) and the running child (reality). A spawn
             refused by the proxy model-receipt gate surfaces its reason
             here, next to the picker that caused it. -->
        <div class="field-hint" id="set-apply-state"></div>
      </div>

      <!-- Autonomous cycle (v0.0.6). The only setting on this page that spends
           the user's subscription while they are not watching, so it carries
           its cost note ABOVE the switch, ships OFF, and shows today's real
           token count next to the cap it is enforced against. -->
      <div class="category" style="margin-top: 2.5rem" id="set-autonomy">
        <div class="category-label" id="set-autonomy-label"></div>
        <p class="subtitle" id="set-autonomy-note"></p>

        <div class="agent-control-row">
          <label for="set-autonomy-enabled" id="set-autonomy-enabled-label"></label>
          <input type="checkbox" id="set-autonomy-enabled" />
        </div>

        <div class="agent-control-row">
          <label for="set-autonomy-start" id="set-autonomy-window-label"></label>
          <span>
            <input type="text" id="set-autonomy-start" size="5" placeholder="02:00" />
            <input type="text" id="set-autonomy-end" size="5" placeholder="06:00" />
          </span>
        </div>
        <div class="field-hint" id="set-autonomy-window-note"></div>

        <div class="agent-control-row">
          <label for="set-autonomy-cap" id="set-autonomy-cap-label"></label>
          <input type="text" id="set-autonomy-cap" size="12" inputmode="numeric" />
        </div>
        <div class="field-hint" id="set-autonomy-cap-note"></div>

        <div class="status-line" id="set-autonomy-usage"></div>
        <div class="status-line" id="set-autonomy-last"></div>

        <div class="step-actions">
          <span class="field-hint hidden" id="set-autonomy-status"></span>
          <button id="set-autonomy-save"></button>
        </div>
      </div>
    </div>

    <div class="toast" id="set-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/settings.js"></script>
  </body>
</html>
