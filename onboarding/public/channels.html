<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade — Channels</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="app-nav"></div>

      <div class="page-header">
        <h1 id="ch-title"></h1>
      </div>
      <p class="subtitle" id="ch-subtitle"></p>

      <!-- ONE card, four slim rows (2026-08-05, the owner: "정보량에 비해서 너무
           많은 부분을 차지하지 않냐" -- four separate cards for one status
           line each was chrome, not information). Each row: on/off dot +
           messenger icon + name/status + buttons; connect flows expand
           under their row inside the same card. Icons are simple-icons
           paths (CC0), inlined -- static markup, no injection surface.
           In-app chat first on purpose: it is the backend with nothing to
           configure, and the /chat page's "switch here" pointer lands on
           this row. No flow -- there is no credential. -->
      <div class="category" id="ch-list">
        <div class="entries">
          <div class="entry-row channel-row" id="ch-local">
            <span class="dot" id="ch-local-dot"></span>
            <svg class="channel-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.8 1.5 5.3 3.9 6.9-.1.9-.5 2.2-1.5 3.4 0 0 2.5-.3 4.5-1.7 1 .3 2 .4 3.1.4 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>
            <div class="entry-main">
              <div class="entry-value" id="ch-local-name"></div>
              <div class="entry-meta" id="ch-local-status"></div>
            </div>
            <button class="secondary hidden" id="ch-local-switch"></button>
          </div>

          <!-- Discord. Reconnect flow markup moved verbatim from
               connectors.html (2026-07-16 split) -- ids conn-* -> ch-*. -->
          <div class="entry-row channel-row" id="ch-discord">
            <span class="dot" id="ch-discord-dot"></span>
            <svg class="channel-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
            <div class="entry-main">
              <div class="entry-value" id="ch-discord-name"></div>
              <div class="entry-meta" id="ch-discord-status"></div>
            </div>
            <button class="secondary hidden" id="ch-discord-switch"></button>
            <button class="secondary" id="ch-discord-reconnect"></button>
          </div>
          <div class="reconnect-flow hidden" id="ch-reconnect-flow">
          <div class="field-hint" id="ch-reconnect-note"></div>
          <div class="field">
            <input type="password" id="ch-reconnect-token" />
          </div>
          <div class="step-actions">
            <span class="status-line" id="ch-reconnect-status"></span>
            <button class="secondary" id="ch-reconnect-enum"></button>
          </div>
          <div class="reconnect-pickers hidden" id="ch-reconnect-pickers">
            <div class="agent-control-row">
              <label for="ch-reconnect-guild" id="ch-reconnect-guild-label"></label>
              <select id="ch-reconnect-guild"></select>
            </div>
            <div class="agent-control-row">
              <label for="ch-reconnect-channel" id="ch-reconnect-channel-label"></label>
              <select id="ch-reconnect-channel"></select>
            </div>
            <div class="field-hint hidden" id="ch-reconnect-truncated"></div>
            <div class="step-actions">
              <span></span>
              <button id="ch-reconnect-apply"></button>
            </div>
          </div>
        </div>

          <!-- Telegram -->
          <div class="entry-row channel-row" id="ch-telegram">
            <span class="dot" id="ch-telegram-dot"></span>
            <svg class="channel-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            <div class="entry-main">
              <div class="entry-value" id="ch-telegram-name"></div>
              <div class="entry-meta" id="ch-telegram-status"></div>
            </div>
            <button class="secondary hidden" id="ch-telegram-switch"></button>
            <button class="secondary" id="ch-telegram-connect"></button>
          </div>
          <div class="reconnect-flow hidden" id="ch-telegram-flow">
          <div class="field-hint" id="ch-telegram-guide"></div>
          <div class="step-actions">
            <span></span>
            <button class="secondary" id="ch-telegram-botfather"></button>
          </div>
          <div class="field-hint" id="ch-telegram-token-note"></div>
          <div class="field">
            <input type="password" id="ch-telegram-token" />
          </div>
          <div class="step-actions">
            <span class="status-line" id="ch-telegram-flow-status"></span>
            <button class="secondary" id="ch-telegram-enum"></button>
          </div>
          <div class="reconnect-pickers hidden" id="ch-telegram-pickers">
            <div class="agent-control-row">
              <label for="ch-telegram-chat" id="ch-telegram-chat-label"></label>
              <select id="ch-telegram-chat"></select>
            </div>
            <div class="step-actions">
              <span></span>
              <button id="ch-telegram-apply"></button>
            </div>
          </div>
        </div>

          <!-- Slack -->
          <div class="entry-row channel-row" id="ch-slack">
            <span class="dot" id="ch-slack-dot"></span>
            <svg class="channel-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg>
            <div class="entry-main">
              <div class="entry-value" id="ch-slack-name"></div>
              <div class="entry-meta" id="ch-slack-status"></div>
            </div>
            <button class="secondary hidden" id="ch-slack-switch"></button>
            <button class="secondary" id="ch-slack-connect"></button>
          </div>
          <div class="reconnect-flow hidden" id="ch-slack-flow">
          <div class="field-hint" id="ch-slack-guide"></div>
          <div class="step-actions">
            <span></span>
            <button class="secondary" id="ch-slack-console"></button>
          </div>
          <div class="field-hint" id="ch-slack-token-note"></div>
          <div class="field">
            <input type="password" id="ch-slack-bot-token" />
          </div>
          <div class="field">
            <input type="password" id="ch-slack-app-token" />
          </div>
          <!-- DM-default (2026-08-04): the primary connect is tokens-only --
               the conversation is the bot's DM. Channel pick is the optional
               secondary path behind the enum button. -->
          <div class="field-hint" id="ch-slack-dm-note"></div>
          <div class="step-actions">
            <span class="status-line" id="ch-slack-flow-status"></span>
            <button class="secondary" id="ch-slack-enum"></button>
            <button id="ch-slack-dm-apply"></button>
          </div>
          <div class="reconnect-pickers hidden" id="ch-slack-pickers">
            <div class="agent-control-row">
              <label for="ch-slack-channel" id="ch-slack-channel-label"></label>
              <select id="ch-slack-channel"></select>
            </div>
            <div class="step-actions">
              <span></span>
              <button id="ch-slack-apply"></button>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>

    <div class="toast" id="ch-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/channels.js"></script>
  </body>
</html>
