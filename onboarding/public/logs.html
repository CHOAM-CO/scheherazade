<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade - Logs</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="app-nav"></div>

      <div class="page-header">
        <h1 id="lg-title"></h1>
      </div>
      <p class="subtitle" id="lg-subtitle"></p>

      <div class="log-toolbar">
        <div class="log-chips" id="lg-sources"></div>
        <div class="log-chips" id="lg-levels"></div>
        <input id="lg-search" type="search" />
        <label class="log-follow"><input type="checkbox" id="lg-wrap" checked /> <span id="lg-wrap-label"></span></label>
        <button class="secondary" id="lg-pause"></button>
        <button class="secondary" id="lg-copy"></button>
        <button class="secondary" id="lg-copy-all">Copy all</button>
        <button class="secondary" id="lg-open" disabled></button>
        <label class="log-follow hidden"><input type="checkbox" id="lg-follow" checked /> <span id="lg-follow-label"></span></label>
      </div>
      <div class="log-pane-wrap">
        <div class="log-pane" id="lg-pane"></div>
        <button class="log-new hidden" id="lg-new"></button>
      </div>
      <p class="log-file-note" id="lg-file-note"></p>
    </div>

    <div class="toast" id="lg-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/logs.js"></script>
  </body>
</html>
