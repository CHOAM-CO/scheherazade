<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade — Memory</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="app-nav"></div>

      <div class="page-header">
        <h1 id="m-title"></h1>
        <div class="page-nav">
          <button class="secondary" id="m-refresh"></button>
          <!-- the old settings <a> is gone (0.2.6 sweep): it duplicated the
               Settings tab one row above and sat off-baseline next to the
               button — zero information, visible misalignment. -->
        </div>
      </div>
      <p class="subtitle" id="m-subtitle"></p>

      <section class="category" aria-labelledby="ai-import-title">
        <h2 id="ai-import-title">Import from another AI</h2>
        <p>Bring a memory export. Nothing becomes a remembered fact until you confirm it.</p>
        <label>Origin <select id="ai-import-source"><option value="chatgpt">ChatGPT</option><option value="claude">Claude</option><option value="other">Other / plain list</option></select></label>
        <label>Memory file <input id="ai-import-file" type="file" accept=".txt,.md,.json"></label>
        <button id="ai-import-submit" class="secondary">Import</button>
        <p id="ai-import-status" role="status" aria-live="polite"></p>
        <div id="ai-import-pending"></div>
      </section>

      <!-- Folder view (0.3.8): tree left, reader right, like a notes app.
           Every section this page used to stack vertically is now either a
           real folder in the tree (DATA_HOME, via /api/agent-files/*) or a
           virtual entry (summary, Recent, the four tables, the database
           journal, session events, imported pointers). memory.js fills both
           panes; nothing here is static content. -->
      <div class="mem-split">
        <div class="mem-side">
          <button class="secondary mem-tree-toggle" id="mem-tree-toggle" aria-expanded="false" aria-controls="mem-tree"></button>
          <nav class="category mem-tree" id="mem-tree"></nav>
        </div>
        <section class="category mem-reader" id="mem-reader">
          <div class="category-header">
            <div class="category-label" id="reader-label"></div>
            <div class="mem-reader-actions" id="reader-actions"></div>
          </div>
          <div class="field-hint" id="reader-hint"></div>
          <div class="status-line" id="reader-status"></div>
          <div id="reader-body"></div>
        </section>
      </div>
    </div>

    <div class="dialog-backdrop hidden" id="m-dialog">
      <div class="dialog-box">
        <p id="m-dialog-text"></p>
        <div class="dialog-actions">
          <button class="secondary" id="m-dialog-cancel"></button>
          <button class="danger" id="m-dialog-confirm"></button>
        </div>
      </div>
    </div>

    <div class="toast" id="m-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/memory.js"></script>
  </body>
</html>
