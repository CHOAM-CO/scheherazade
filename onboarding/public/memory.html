<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade — 기억</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="page-header">
        <h1 id="m-title"></h1>
        <div class="page-nav">
          <button class="secondary" id="m-refresh"></button>
          <a href="/settings" id="m-settings-link"></a>
        </div>
      </div>
      <p class="subtitle" id="m-subtitle"></p>

      <div id="m-session-group" class="session-group hidden">
        <div class="category-label" id="m-session-label"></div>
        <div id="m-session-list"></div>
      </div>

      <div class="category" id="cat-agent-control">
        <div class="category-label" id="cat-agent-control-label"></div>
        <div class="status-line" id="agent-status-line"></div>
        <!-- Mute-revert offer. Hidden until the strike ledger says the running
             model was told to speak and still didn't (see stop-reply-guard). -->
        <div class="mute-banner" id="agent-mute-banner" hidden>
          <div class="mute-banner-text" id="agent-mute-text"></div>
          <button type="button" id="agent-mute-revert"></button>
        </div>
        <div class="agent-control-row">
          <label for="agent-model-select" id="agent-model-label"></label>
          <select id="agent-model-select"></select>
        </div>
        <div class="agent-control-row">
          <label for="agent-effort-select" id="agent-effort-label"></label>
          <select id="agent-effort-select"></select>
        </div>
        <div class="agent-control-actions">
          <button class="secondary" id="agent-btn-startstop"></button>
          <button class="secondary hidden" id="agent-btn-restart"></button>
          <button class="secondary hidden" id="agent-btn-discord"></button>
        </div>
      </div>

      <!-- Imported pointers (v0.0.4 item d). Visually and structurally SEPARATE
           from the agent's own memory categories below: this is borrowed
           knowledge from other tools, it holds locations rather than content,
           and it never blends into user_facts/open_threads/corrections/
           preferences (imported_pointers is not in WRITABLE_TABLES). -->
      <div class="category" id="cat-pointers">
        <div class="category-label" id="cat-pointers-label"></div>
        <div class="pointers-intro" id="pointers-intro"></div>
        <div class="pointers-coverage" id="pointers-coverage"></div>
        <div class="pointers-actions">
          <button class="secondary" id="pointers-scan"></button>
          <button class="secondary" id="pointers-clear"></button>
        </div>
        <div class="status-line" id="pointers-status"></div>
        <div class="entries" id="pointers-entries"></div>
      </div>

      <div class="category" id="cat-user_facts">
        <div class="category-label" id="cat-user_facts-label"></div>
        <div class="entries" id="cat-user_facts-entries"></div>
      </div>
      <div class="category" id="cat-open_threads">
        <div class="category-label" id="cat-open_threads-label"></div>
        <div class="entries" id="cat-open_threads-entries"></div>
      </div>
      <div class="category" id="cat-corrections">
        <div class="category-label" id="cat-corrections-label"></div>
        <div class="entries" id="cat-corrections-entries"></div>
      </div>
      <div class="category" id="cat-preferences">
        <div class="category-label" id="cat-preferences-label"></div>
        <div class="entries" id="cat-preferences-entries"></div>
      </div>
    </div>

    <div class="dialog-backdrop hidden" id="m-dialog">
      <div class="dialog-box">
        <p id="m-dialog-text"></p>
        <div class="dialog-actions">
          <button class="secondary" id="m-dialog-cancel"></button>
          <button class="danger" id="m-dialog-confirm"></button>
        </div>
      </div>
    </div>

    <div class="toast" id="m-toast"></div>

    <script src="/js/copy.js"></script>
    <script src="/js/memory.js"></script>
  </body>
</html>
