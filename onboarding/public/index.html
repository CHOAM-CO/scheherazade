<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheherazade — Setup</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="card" id="wizard-card">
        <p class="field-hint" id="wizard-progress" role="status"></p>
        <!-- Step 0 -->
        <section class="step" data-step="0">
          <h1 id="s0-title"></h1>
          <p id="s0-body"></p>
          <div class="step-actions">
            <span></span>
            <button id="s0-next"></button>
          </div>
        </section>

        <!-- Step 1: BYOK -->
        <section class="step hidden" data-step="1">
          <h1 id="s1-title"></h1>
          <p id="s1-body"></p>
          <!-- Zero-auth consent card. Appears only when a Claude Code CLI login
               already exists on this machine (existence check, never read). The
               cost line is mandatory copy: reusing the login spends the user's
               own subscription quota. -->
          <div class="found-login hidden" id="s1-found-login">
            <div class="found-login-title" id="s1-found-login-title"></div>
            <div class="found-login-body" id="s1-found-login-body"></div>
            <div class="found-login-cost" id="s1-found-login-cost"></div>
            <div class="found-login-stale" id="s1-found-login-stale"></div>
            <button type="button" id="s1-found-login-use"></button>
            <div class="found-login-alt" id="s1-found-login-alt"></div>
          </div>
          <!-- Claude CLI preflight (2026-08-04, the owner "2로 가자"): every
               provider mode runs on the user's own claude CLI. When it is
               missing this panel offers the managed install (mac) or the
               manual command (win) BEFORE the user invests in the flow. -->
          <div class="found-login hidden" id="s1-cli-preflight">
            <div class="found-login-title" id="s1-cli-title"></div>
            <div class="found-login-body" id="s1-cli-body"></div>
            <div class="found-login-cost" id="s1-cli-plan"></div>
            <div class="status-line" id="s1-cli-status"></div>
            <button type="button" id="s1-cli-install"></button>
            <div class="found-login-alt" id="s1-cli-manual"></div>
          </div>
          <div class="tabs" id="s1-tabs"></div>
          <div class="field-hint hidden" id="s1-router-note"></div>
          <div class="field">
            <input type="password" id="s1-key" placeholder="Paste your key" autocomplete="off" />
            <div class="field-hint" id="s1-hint"></div>
          </div>
          <div class="status-line" id="s1-status"></div>
          <div class="step-actions">
            <span></span>
            <button id="s1-next"></button>
          </div>
        </section>

        <!-- Step 1b: import from other agent tools (design-0022 §4). Shown
             only when /api/migrate/import/plan finds something; one card per
             detected tool, per-file checkboxes, nothing copied without the
             Copy click. -->
        <section class="step hidden" data-step="1b">
          <h1 id="s1b-title"></h1>
          <p id="s1b-body"></p>
          <p class="field-hint" id="s1b-safety"></p>
          <div id="s1b-tools"></div>
          <div class="status-line" id="s1b-status"></div>
          <div class="step-actions">
            <button class="secondary" id="s1b-skip"></button>
            <button id="s1b-copy"></button>
          </div>
        </section>

        <!-- Step 2: name -->
        <section class="step hidden" data-step="2">
          <h1 id="s2-title"></h1>
          <p id="s2-body"></p>
          <div class="field">
            <label for="s2-name">Name</label>
            <input type="text" id="s2-name" />
          </div>
          <div class="step-actions">
            <button class="secondary" id="s2-back" type="button">Back</button>
            <button id="s2-next"></button>
          </div>
        </section>

        <!-- Step 3: persona -->
        <section class="step hidden" data-step="3">
          <h1 id="s3-title"></h1>
          <div id="seed-choice" class="field"><h2 id="seed-title">A starting trait</h2><p id="seed-note">Choose a starting point for your companion.</p>
          <div class="radio-row"><label><input type="radio" name="seed" value="curiosity"><span id="seed-curiosity-label">Curiosity</span></label><label><input type="radio" name="seed" value="care"><span id="seed-care-label">Care</span></label><label><input type="radio" name="seed" value="mischief"><span id="seed-mischief-label">Playfulness</span></label><label><input type="radio" name="seed" value="custom"><span id="seed-custom-label">Write your own</span></label></div>
          <label for="seed-text" id="seed-text-label">Your starting trait</label><input type="text" id="seed-text" maxlength="120" placeholder="One short sentence"></div>
          <div class="field">
            <label id="s3-q1-label"></label>
            <div class="radio-row" id="s3-q1-options"></div>
          </div>
          <div class="field">
            <label for="s3-q2-text" id="s3-q2-label"></label>
            <input type="text" id="s3-q2-text" />
            <div class="chips" id="s3-q2-chips"></div>
          </div>
          <div class="field">
            <label id="s3-q3-label"></label>
            <div class="radio-row">
              <label><input type="radio" name="s3-q3" value="yes" /> <span id="s3-q3-yes-prefix"></span></label>
              <input type="time" aria-label="Available from" id="s3-q3-start" value="09:00" style="width: auto" />
              <span>~</span>
              <input type="time" aria-label="Available until" id="s3-q3-end" value="22:00" style="width: auto" />
              <span id="s3-q3-yes-suffix"></span>
              <label><input type="radio" name="s3-q3" value="no" /> <span id="s3-q3-no"></span></label>
            </div>
            <div class="field-hint" id="s3-q3-note"></div>
          </div>
          <div class="status-line failure hidden" id="s3-status"></div>
          <div class="step-actions">
            <button class="secondary" id="s3-back" type="button">Back</button>
            <button id="s3-next"></button>
          </div>
        </section>

        <!-- Step 4: where to talk (in-app chat slice 5). In-app chat is the
             PRIMARY action -- it needs no third-party account, and clicking
             it finishes setup with a conversation open. Messengers demoted
             to optional upgrades; the old "do this later" link is GONE
             because it ended setup with an agent the user could not reach
             (docs/in-app-chat-plan.md WHY) -- in-app chat is what "later"
             should always have been. -->
        <section class="step hidden" data-step="4">
          <h1 id="s4-title"></h1>
          <p id="s4-body"></p>
          <div class="connect-list">
            <div class="connect-item">
              <button id="s4-start-chat"></button>
              <span class="connect-note" id="s4-chat-note"></span>
            </div>
            <div class="connect-item">
              <button class="secondary" id="s4-connect-discord"></button>
              <span class="connect-note" id="s4-discord-note"></span>
            </div>
            <div class="connect-item">
              <button class="secondary" id="s4-connect-slack"></button>
              <span class="connect-note" id="s4-slack-note"></span>
            </div>
            <div class="connect-item">
              <button class="secondary" id="s4-connect-telegram"></button>
              <span class="connect-note" id="s4-telegram-note"></span>
            </div>
          </div>
        </section>

        <!-- Step 4b: Discord tutorial -->
        <section class="step hidden" data-step="4b">
          <h1 id="s4b-title"></h1>
          <div id="s4b-tutorial-body"></div>
          <div id="s4b-token-field" class="field hidden">
            <label id="s4b-token-label"></label>
            <input type="password" id="s4b-token" autocomplete="off" />
            <div class="connect-item hidden" id="s4b-invite-row">
              <button class="secondary" id="s4b-invite-open"></button>
              <span class="connect-note" id="s4b-invite-note"></span>
            </div>
          </div>
          <div class="status-line hidden" id="s4b-status"></div>
          <div class="tutorial-nav">
            <span class="tutorial-progress" id="s4b-progress"></span>
            <div>
              <button class="secondary" id="s4b-prev"></button>
              <button id="s4b-action"></button>
            </div>
          </div>
        </section>

        <!-- Step 5: handoff, 3-state (connecting/live/failed) -->
        <section class="step hidden" data-step="5">
          <h1 id="s5-title"></h1>
          <p id="s5-body"></p>
          <div class="step-actions">
            <span></span>
            <div class="button-row" id="s5-buttons"></div>
          </div>
        </section>
      </div>
    </div>

    <script src="/js/copy.js"></script>
    <script src="/js/import-picker.js"></script>
    <script src="/js/wizard.js"></script>
  </body>
</html>
