# Slack app manifest — Scheherazade
# Source: Mino's production day-work agent manifest (2026-08-05 11:45),
# masked per his instruction: name / description / display_name only.
# DEVIATION, on purpose and on record: bot_events gained message.channels +
# message.groups — his original carries only app_mention + message.im, which
# leaves this app's home-channel mode silent (channel-slack.mjs consumes
# plain `message` events in the home channel; DM mode alone would survive).
# Nothing was removed or reordered. Everything else is verbatim.
# Canonical copy: the fenced yaml block in SKILL.md must stay byte-identical
# to this file below the marker — scripts/test-slack-manifest.mjs enforces it.
# --- manifest ---
display_information:
  name: Scheherazade
  description: Personal AI agent
  background_color: "#5b8c30"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Scheherazade
    always_online: true
oauth_config:
  scopes:
    user:
      - channels:history
      - im:history
    bot:
      - usergroups:write
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - bookmarks:write
      - calls:read
      - calls:write
      - canvases:read
      - canvases:write
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - users:read
      - users:read.email
      - users:write
      - usergroups:read
  pkce_enabled: false
settings:
  event_subscriptions:
    user_events:
      - message.channels
      - message.im
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
